<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Isreal Fowosere, software engineering, web development, and graphic design. A few life updates, one message at a time.">
  <title>Isreal · Messages</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%230078ff'/%3E%3Cpath d='M25 15c0 5-4 8-9 8h-3l-5 3 1-5c-2-1-3-4-3-6 0-5 4-8 10-8s9 3 9 8' fill='white'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="styles.css"><link rel="stylesheet" href="profile.css">
  <script type="module" src="/app.js"></script>
</head>
<body>
  <main class="portfolio">
    <section class="conversation" aria-label="Messages from Isreal">
      <header class="contact-header">
        <button class="contact-toggle" aria-expanded="false" aria-controls="contact-panel" aria-label="Show Isreal's contact information">
          <img class="avatar" src="assets/profile.jpg" alt="Isreal's profile picture: Prince Zuko against an orange background" width="58" height="58">
          <span class="contact-name">Olufowosere <span class="chevron" aria-hidden="true">›</span></span>
        </button>
      </header>
      <div class="timeline" tabindex="0" aria-label="Career timeline"><p class="timeline-status" role="status">Loading messages…</p></div>
      <footer class="composer-dock">
        <form class="composer" id="contact-form">
          <input id="contact-input" type="text" name="contact" aria-label="Your email, phone number, or social handle" placeholder="Send a message" maxlength="1000" required minlength="3" autocomplete="off">
          <input class="contact-trap" name="website" type="text" tabindex="-1" autocomplete="off" aria-hidden="true">
          <button id="contact-send" type="submit" aria-label="Send contact details"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M12 19V5M5 12l7-7 7 7" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
        </form>
        <p id="contact-status" role="status" aria-live="polite"></p>
      </footer>
    </section>
    <aside class="contact-panel modern-profile" id="contact-panel" aria-label="Profile" hidden></aside>
  </main>
</body>
</html>
